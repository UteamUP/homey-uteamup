<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B7BC8"/>
      <stop offset="1" stop-color="#2B357F"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A8F45"/>
      <stop offset="1" stop-color="#196736"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="700">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1A40" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="url(#sky)"/>
  <circle cx="860" cy="110" r="300" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="140" cy="640" r="260" fill="#FFFFFF" opacity="0.05"/>

  <!-- Ground and a house with lit windows -->
  <path d="M0 560 C 220 520 420 530 620 560 S 900 600 1000 570 V700 H0 Z" fill="url(#ground)"/>
  <g filter="url(#shadow)">
    <rect x="390" y="215" width="40" height="80" fill="#D9DEEA"/>
    <path d="M110 330 L290 190 L470 330 V560 H110 Z" fill="#F4F6FB"/>
    <path d="M85 345 L290 175 L495 345 L470 368 L290 220 L110 368 Z" fill="#F37221"/>
    <rect x="160" y="380" width="90" height="80" rx="8" fill="#FAED24"/>
    <rect x="330" y="380" width="90" height="80" rx="8" fill="#FAED24"/>
    <rect x="250" y="450" width="80" height="110" rx="8" fill="#206BB5"/>
  </g>

  <!-- A water drop by the house: the sensor that reports a problem -->
  <path d="M520 470 C 520 470 548 505 548 524 A 28 28 0 0 1 492 524 C 492 505 520 470 520 470 Z" fill="#7FD3FF"/>

  <!-- Work order card -->
  <g filter="url(#shadow)">
    <rect x="590" y="150" width="330" height="360" rx="28" fill="#FFFFFF"/>
    <g transform="translate(622 182) scale(0.16)">
      <polygon points="200,50 340,130 200,130" fill="#F7AD1A"/>
      <polygon points="200,50 60,130 200,130" fill="#F37221"/>
      <polygon points="60,130 200,130 200,210" fill="#FAED24"/>
      <polygon points="340,130 200,130 200,210" fill="#FAED24"/>
      <polygon points="60,130 200,210 200,370 60,290" fill="#1A8F45"/>
      <polygon points="340,130 200,210 200,370 340,290" fill="#206BB5"/>
    </g>
    <rect x="700" y="196" width="150" height="16" rx="8" fill="#2B357F"/>
    <rect x="700" y="222" width="100" height="12" rx="6" fill="#C9CFDD"/>

    <circle cx="642" cy="292" r="18" fill="#1A8F45"/>
    <path d="M633 292 l7 7 l12 -14" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="676" y="284" width="200" height="16" rx="8" fill="#DDE2EC"/>

    <circle cx="642" cy="356" r="18" fill="#F37221"/>
    <rect x="639" y="344" width="6" height="15" rx="3" fill="#FFFFFF"/>
    <circle cx="642" cy="366" r="3.5" fill="#FFFFFF"/>
    <rect x="676" y="348" width="170" height="16" rx="8" fill="#DDE2EC"/>

    <circle cx="642" cy="420" r="18" fill="#206BB5"/>
    <circle cx="642" cy="420" r="7" fill="#FFFFFF"/>
    <rect x="676" y="412" width="185" height="16" rx="8" fill="#DDE2EC"/>

    <rect x="622" y="460" width="130" height="28" rx="14" fill="#F37221"/>
  </g>

  <!-- Alert bell with a badge -->
  <g filter="url(#shadow)" transform="translate(-20 15)">
    <circle cx="905" cy="140" r="52" fill="#FAED24"/>
    <path d="M905 108 c-20 0 -32 15 -32 34 v22 l-10 12 h84 l-10 -12 v-22 c0 -19 -12 -34 -32 -34 z" fill="#2B357F"/>
    <circle cx="905" cy="186" r="9" fill="#2B357F"/>
    <circle cx="940" cy="104" r="16" fill="#E5322D"/>
  </g>
</svg>
